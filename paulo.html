 min-height:100vh;display:flex;justify-content:center;padding:22px 14px 40px}
.wrap{width:100%;max-width:430px}
.card{background:linear-gradient(180deg,var(--card),#0A1628);border:1px solid var(--line);border-radius:26px;
 overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.top{height:116px;background:var(--grad);position:relative}
.top::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 20% 0%,rgba(255,255,255,.3),transparent 60%)}
.mono{width:128px;height:128px;border-radius:50%;position:absolute;left:50%;transform:translateX(-50%);top:52px;z-index:4;
 background:radial-gradient(120% 120% at 30% 25%,#13294a,#0a1526);
 border:3px solid var(--blue2);display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 0 6px var(--card)}
.mono span{font-family:'Poppins';font-weight:700;font-size:42px;letter-spacing:.03em;
 background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.body{padding:74px 22px 24px;text-align:center}
.name{font-family:'Poppins';font-weight:700;font-size:23px;margin:0 0 4px;line-height:1.2}
.role{color:var(--blue2);font-weight:600;font-size:15px;margin:0 0 2px}
.org{color:var(--muted);font-size:13.5px;letter-spacing:.14em;font-weight:600;margin:0 0 9px}
.loc{color:var(--muted);font-size:13px;margin-bottom:18px}
.btns{display:flex;flex-direction:column;gap:10px;margin:0 2px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:14px;font-weight:600;
 font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn svg{width:19px;height:19px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(46,124,228,.4)}
.btn-wa{background:var(--wa);color:#07301a}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.btn-out{background:transparent;border-color:var(--line);color:var(--text)}
.tools{display:flex;gap:10px;margin-top:20px}
.tools button{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--text);
 font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.tools button:hover{border-color:var(--blue2)}
.qrwrap{display:none;text-align:center;margin-top:16px}.qrwrap.open{display:block}
.qrwrap img{width:190px;height:190px;border-radius:14px;background:#fff;padding:10px}
.qrwrap p{color:var(--muted);font-size:12px;margin:8px 0 0}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.foot .motto{color:var(--blue2);font-size:12px;letter-spacing:.12em;font-weight:600;font-family:'Poppins'}
.foot a.owner{display:inline-block;margin-top:7px;color:var(--muted);font-size:11.5px;text-decoration:none}
.foot a.owner:hover{color:var(--blue2)}
</style></head><body>
