<title>LEOG — Prestação de Serviços & Comércio</title>
<meta name="description" id="metaDesc" content="Cartão de visita digital da LEOG.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF4FB;--card:#FFFFFF;--blue:#1663C7;--blue2:#2E86DE;--green:#2FA84F;--grad:linear-gradient(135deg,#1663C7,#2FA84F);--text:#1C2A3A;--muted:#6B7C8F;--line:rgba(22,99,199,.14);--card2:#F1F6FB;--wa:#25D366;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:radial-gradient(130% 90% at 50% -10%,#CFE6F7 0%,#E6F1FA 45%,var(--bg) 100%);min-height:100vh;display:flex;justify-content:center;padding:22px 14px 40px}
.wrap{width:100%;max-width:430px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 22px 55px rgba(22,99,199,.16)}
.top{height:116px;background:var(--grad);position:relative}
.top::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 20% 0%,rgba(255,255,255,.35),transparent 60%)}
.langbtn{position:absolute;top:14px;right:14px;z-index:5;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.langmenu{position:absolute;top:50px;right:14px;z-index:6;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:none;min-width:160px;box-shadow:0 14px 34px rgba(22,99,199,.22);max-height:320px;overflow-y:auto}
.langmenu.open{display:block}
.langmenu a{display:flex;gap:9px;align-items:center;padding:11px 14px;color:var(--text);text-decoration:none;font-size:14px;cursor:pointer}
.langmenu a:hover{background:var(--card2)}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#fff;border:4px solid #fff;position:absolute;left:50%;transform:translateX(-50%);top:50px;z-index:4;box-shadow:0 10px 26px rgba(22,99,199,.28)}
.body{padding:78px 22px 24px;text-align:center}
.name{font-family:'Poppins';font-weight:700;font-size:26px;letter-spacing:.04em;margin:0 0 3px}
.role{color:var(--blue);font-weight:600;font-size:14px;margin:0 0 8px}
.lema{font-style:italic;color:#4A5A6B;font-size:14px;margin:4px 16px 8px}
.welcome{display:inline-block;margin:2px 10px 10px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card2);color:#33566f;font-size:12.5px;line-height:1.4}
.loc{color:var(--muted);font-size:13px;margin-bottom:16px}
.btns{display:flex;flex-direction:column;gap:10px;margin:0 2px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn svg{width:19px;height:19px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(22,99,199,.32)}
.btn-wa{background:var(--wa);color:#07301a}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.btn-out{background:#fff;border-color:var(--line);color:var(--text)}
.quote{margin:20px 2px;padding:16px 18px;border-left:3px solid var(--green);background:var(--card2);border-radius:0 14px 14px 0;text-align:left;font-size:14.5px;line-height:1.55;color:#33566f;font-style:italic}
.sec{margin-top:22px;text-align:left}
.sec h3{font-family:'Poppins';font-size:13px;letter-spacing:.06em;color:var(--blue);margin:0 0 10px}
.pcard{display:flex;align-items:center;gap:13px;padding:13px 14px;margin-bottom:9px;text-decoration:none;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);transition:.15s}
.pcard:hover{border-color:var(--blue2);transform:translateY(-1px)}
.pico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--grad)}
.pico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.ptxt b{font-size:14.5px;font-weight:600}
.parr{color:var(--blue2);font-size:20px}
.socials{display:flex;justify-content:center;gap:13px;margin:22px 0 6px}
.socials a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.socials a svg{width:22px;height:22px;fill:var(--blue)}
.socials a:hover{background:var(--grad)}.socials a:hover svg{fill:#fff}
.tools{display:flex;gap:10px;margin-top:18px}
.tools button{flex:1;padding:12px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.tools button:hover{border-color:var(--blue2)}
.qrwrap{display:none;text-align:center;margin-top:16px}.qrwrap.open{display:block}
.qrwrap img{width:190px;height:190px;border-radius:14px;background:#fff;padding:10px;border:1px solid var(--line)}
.qrwrap p{color:var(--muted);font-size:12px;margin:8px 0 0}
.foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.foot .motto{color:var(--green);font-size:12px;letter-spacing:.1em;font-weight:600;font-family:'Poppins'}
.foot a.owner{display:inline-block;margin-top:7px;color:var(--muted);font-size:11.5px;text-decoration:none}
</style></head><body>

Object.keys(I18N).forEach(code=>{const t=I18N[code];const a=document.createElement('a');a.innerHTML="<span>"+t._flag+"</span><span>"+t._name+"</span>";a.onclick=()=>{applyLang(code);menu.classList.remove('open');};menu.appendChild(a);});
document.getElementById('langBtn').onclick=()=>menu.classList.toggle('open');
document.addEventListener('click',e=>{if(!e.target.closest('#langBtn')&&!e.target.closest('#langMenu'))menu.classList.remove('open');});
document.getElementById('btnSave').onclick=()=>{const blob=new Blob([VCARD.replace(/\\n/g,"\r\n")],{type:"text/vcard"});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download="LEOG.vcf";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);};
document.getElementById('qrToggle').onclick=()=>document.getElementById('qrwrap').classList.toggle('open');
document.getElementById('shareBtn').onclick=async()=>{const d={title:"LEOG",text:"Cartão de visita digital",url:location.href};if(navigator.share){try{await navigator.share(d);}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);alert("Link copiado!");}catch(e){}}};
let init="pt";try{const s=localStorage.getItem('leog_lang');if(s&&I18N[s])init=s;else{const n=(navigator.language||"").slice(0,2).toLowerCase();if(I18N[n])init=n;}}catch(e){}
applyLang(init);
</script></body></html>
