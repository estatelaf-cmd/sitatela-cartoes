const sc=document.getElementById('socials');
[["instagram",CARD.instagram],["facebook",CARD.facebook],["tiktok",CARD.tiktok],["linkedin",CARD.linkedin]].forEach(([k,u])=>{if(!u)return;const a=document.createElement('a');a.href=u;a.target="_blank";a.rel="noopener";a.title=k;a.innerHTML=ICONS[k];sc.appendChild(a);});
function applyLang(code){cur=code;const t=I18N[code];if(!t)return;document.documentElement.lang=t._html;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!=null)el.textContent=t[k];});
 document.getElementById('metaDesc').setAttribute('content',t.meta);
 document.getElementById('langBtn').textContent=t._flag+" "+t._code+" ▾";
 document.getElementById('btnWa').href="https://wa.me/"+WA+"?text="+encodeURIComponent(t.waMsg);
 document.getElementById('svc1').href="https://wa.me/"+WA+"?text="+encodeURIComponent(t.waSvc+t.s1);
 try{localStorage.setItem('aefc_lang',code);}catch(e){}}
const menu=document.getElementById('langMenu');
Object.keys(I18N).forEach(code=>{const t=I18N[code];const a=document.createElement('a');a.innerHTML="<span>"+t._flag+"</span><span>"+t._name+"</span>";a.onclick=()=>{applyLang(code);menu.classList.remove('open');};menu.appendChild(a);});
document.getElementById('langBtn').onclick=()=>menu.classList.toggle('open');
document.addEventListener('click',e=>{if(!e.target.closest('#langBtn')&&!e.target.closest('#langMenu'))menu.classList.remove('open');});
document.getElementById('btnSave').onclick=()=>{const blob=new Blob([VCARD.replace(/\\n/g,"\r\n")],{type:"text/vcard"});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download="Adalmiro-Calandula.vcf";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);};
document.getElementById('qrToggle').onclick=()=>document.getElementById('qrwrap').classList.toggle('open');
document.getElementById('shareBtn').onclick=async()=>{const d={title:"Adalmiro Calandula — AEFC",text:"Cartão de visita digital",url:location.href};if(navigator.share){try{await navigator.share(d);}catch(e){}}else{try{await navigator.clipboard.writeText(location.href);alert("Link copiado!");}catch(e){}}};
let init="pt";try{const s=localStorage.getItem('aefc_lang');if(s&&I18N[s])init=s;else{const n=(navigator.language||"").toLowerCase();if(n.startsWith("en"))init="en";else if(n.startsWith("fr"))init="fr";}}catch(e){}
applyLang(init);
