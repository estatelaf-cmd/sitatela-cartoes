<title>Santa André Abílio — Prisma Corporativa</title>
<meta name="description" id="metaDesc" content="Cartão de visita digital de Santa André Abílio — Prisma Corporativa.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060C1A;--bg2:#0A1730;--card:#0C1A34;--card2:#122444;--navy:#0A1A3A;--blue:#2E6BD6;--blue2:#6FA8EC;--silver:#C0D0E0;
 --grad:linear-gradient(135deg,#143B86,#2E6BD6);--text:#EAF1FB;--muted:#9DB0CE;--line:rgba(111,168,236,.18);--wa:#25D366;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);
 background:radial-gradient(130% 90% at 50% -10%,#123064 0%,var(--bg2) 42%,var(--bg) 100%);
 min-height:100vh;display:flex;justify-content:center;padding:22px 14px 40px}
.wrap{width:100%;max-width:430px}
.card{background:linear-gradient(180deg,var(--card),#081024);border:1px solid var(--line);border-radius:26px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.top{height:116px;background:var(--grad);position:relative}
.top::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 20% 0%,rgba(255,255,255,.28),transparent 60%)}
.langbtn{position:absolute;top:14px;right:14px;z-index:5;background:rgba(6,12,26,.4);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;backdrop-filter:blur(6px)}
.langmenu{position:absolute;top:50px;right:14px;z-index:6;background:#0C1A34;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:none;min-width:160px;box-shadow:0 14px 34px rgba(0,0,0,.5);max-height:320px;overflow-y:auto}
.langmenu.open{display:block}
.langmenu a{display:flex;gap:9px;align-items:center;padding:11px 14px;color:var(--text);text-decoration:none;font-size:14px;cursor:pointer}
.langmenu a:hover{background:var(--card2)}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:4px solid var(--card);position:absolute;left:50%;transform:translateX(-50%);top:50px;z-index:4;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.body{padding:78px 22px 24px;text-align:center}
.name{font-family:'Poppins';font-weight:700;font-size:22px;margin:0 0 4px;line-height:1.2}
.role{color:var(--blue2);font-weight:600;font-size:14.5px;margin:0 0 2px}
.org{color:var(--muted);font-size:12.5px;letter-spacing:.18em;font-weight:600;margin:0 0 9px}
.loc{color:var(--muted);font-size:13px;margin-bottom:18px}
.btns{display:flex;flex-direction:column;gap:10px;margin:0 2px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn svg{width:19px;height:19px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 22px rgba(46,107,214,.38)}
.btn-wa{background:var(--wa);color:#07301a}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.btn-out{background:transparent;border-color:var(--line);color:var(--text)}
.sec{margin-top:22px;text-align:left}
.sec h3{font-family:'Poppins';font-size:13px;letter-spacing:.06em;color:var(--blue2);margin:0 0 10px}
.pcard{display:flex;align-items:center;gap:13px;padding:13px 14px;margin-bottom:9px;text-decoration:none;background:var(--card2);border:1px solid var(--line);border-radius:14px;color:var(--text);transition:.15s}
.pcard:hover{border-color:var(--blue2);transform:translateY(-1px)}
.pico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--grad)}
.pico svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.ptxt b{font-size:14.5px;font-weight:600}
.parr{color:var(--blue2);font-size:20px}
.socials{display:flex;justify-content:center;gap:13px;margin:22px 0 6px}
